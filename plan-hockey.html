<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Plan hockey</title>
<style>

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap');

:root {
  --fondo: #0A1E28;
  --sup: #102C38;
  --sup2: #16394A;
  --linea: #23505F;
  --texto: #E8F1F2;
  --tenue: #8AA6B0;
  --bola: #F2C230;
  --tipo: Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
}
.hk {
  font-family: var(--tipo);
  background: var(--fondo);
  color: var(--texto);
  min-height: 100vh;
  padding-bottom: 3rem;
  -webkit-font-smoothing: antialiased;
}
.hk *, .hk *::before, .hk *::after { box-sizing: border-box; }
.hk button { font-family: inherit; cursor: pointer; }
.hk button:focus-visible, .hk input:focus-visible, .hk a:focus-visible {
  outline: 2px solid var(--bola); outline-offset: 2px;
}
.hk-carga { display: flex; align-items: center; justify-content: center;
  color: var(--tenue); font-size: .9rem; }

.hk-top {
  position: sticky; top: 0; z-index: 10;
  background: linear-gradient(180deg, var(--fondo) 76%, rgba(10,30,40,.94) 100%);
  padding: .9rem 1rem .7rem; border-bottom: 1px solid var(--linea);
}
.hk-nav { display: flex; align-items: center; gap: .5rem; }
.hk-cab { flex: 1; text-align: center; }
.hk-mes { font-size: .7rem; font-weight: 600; color: var(--tenue); letter-spacing: .08em; }
.hk-rango { font-size: 1.5rem; font-weight: 800; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; line-height: 1.1; }
.hk-flecha { background: none; border: 1px solid var(--linea); color: var(--texto);
  width: 2.1rem; height: 2.1rem; border-radius: 50%; font-size: 1.3rem; line-height: 1;
  padding: 0 0 .18em; display: grid; place-items: center; flex: none; }
.hk-flecha:disabled { opacity: .28; cursor: default; }
.hk-etiqueta { text-align: center; font-size: .78rem; color: var(--tenue);
  margin-top: .15rem; line-height: 1.3; }

.hk-tira { display: flex; gap: .3rem; margin: .75rem 0 .6rem; }
.hk-dia { flex: 1; background: none; border: 0; padding: .35rem 0 .3rem;
  display: flex; flex-direction: column; align-items: center; gap: .32rem; border-radius: 4px; }
.hk-dia-letra { font-size: .68rem; font-weight: 600; color: var(--tenue); }
.hk-punto { width: 9px; height: 9px; border-radius: 50%;
  border: 1.5px solid var(--linea); background: transparent; }
.hk-dia-pendiente .hk-punto { border-color: var(--dc); }
.hk-dia-parcial .hk-punto { border-color: var(--dc);
  background: linear-gradient(90deg, var(--dc) 50%, transparent 50%); }
.hk-dia-completo .hk-punto { border-color: var(--dc); background: var(--dc); }
.hk-dia-descanso .hk-punto { border: 0; height: 2px; width: 11px; border-radius: 0;
  background: var(--linea); }
.hk-dia-vacio .hk-punto { opacity: .3; }

.hk-barra { height: 3px; background: var(--sup2); border-radius: 2px; overflow: hidden; }
.hk-barra-int { height: 100%; background: var(--bola); border-radius: 2px; transition: width .3s ease; }
.hk-resumen { display: flex; align-items: baseline; gap: .35rem; margin-top: .45rem;
  font-size: .75rem; color: var(--tenue); }
.hk-cifra { font-size: 1rem; font-weight: 800; color: var(--texto);
  font-variant-numeric: tabular-nums; }
.hk-guardando { margin-left: auto; color: var(--bola); font-size: .68rem; }
.hk-error { margin-left: auto; color: #E8756B; font-size: .68rem; font-weight: 600; text-align: right; }

.hk-nota-semana { margin: .85rem 1rem 0; padding: .7rem .8rem; background: var(--sup);
  border-left: 2px solid var(--linea); font-size: .78rem; line-height: 1.5; color: var(--tenue); }

.hk-ses { margin: 1.1rem 1rem 0; padding-left: .8rem;
  border-left: 3px solid var(--tc, var(--linea)); }
.hk-ses-ok { border-left-color: var(--bola); }
.hk-ses-rest { border-left-style: dotted; border-left-color: var(--linea); }
.hk-ses-cab { display: flex; justify-content: space-between; align-items: flex-start;
  gap: .6rem; margin-bottom: .55rem; }
.hk-ses-dia { font-size: .7rem; font-weight: 600; color: var(--tenue);
  font-variant-numeric: tabular-nums; }
.hk-ses-tit { margin: .1rem 0 0; font-size: .97rem; font-weight: 700;
  line-height: 1.25; letter-spacing: -.01em; }
.hk-ses-cont { font-size: .8rem; font-weight: 700; color: var(--tenue);
  font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: .5rem; }
.hk-rest-txt { margin: 0; font-size: .8rem; color: var(--tenue); line-height: 1.45; }

.hk-lista { list-style: none; margin: 0; padding: 0; }
.hk-ej { border-top: 1px solid var(--linea); }
.hk-ej:last-child { border-bottom: 1px solid var(--linea); }
.hk-ej-fila { display: flex; gap: .65rem; padding: .6rem 0; align-items: flex-start; }
.hk-check { flex: none; width: 26px; height: 26px; margin-top: .1rem;
  border: 1.5px solid var(--linea); border-radius: 6px; background: transparent;
  display: grid; place-items: center; padding: 0; }
.hk-check-marca { width: 12px; height: 12px; border-radius: 3px; background: transparent; }
.hk-ej-ok .hk-check { border-color: var(--bola); background: var(--bola); }
.hk-ej-ok .hk-check-marca { background: var(--fondo);
  clip-path: polygon(14% 46%, 0 60%, 40% 100%, 100% 22%, 86% 8%, 38% 70%);
  width: 15px; height: 15px; border-radius: 0; }
.hk-ej-cuerpo { flex: 1; min-width: 0; }
.hk-ej-nombre { margin: 0; color: var(--texto); font-size: .87rem; font-weight: 500;
  line-height: 1.35; }
.hk-ej-ok .hk-ej-nombre { color: var(--tenue); }
.hk-sust { color: #A97BE0; margin-right: .3rem; font-size: .7rem; }
.hk-ej-datos { display: flex; align-items: center; gap: .45rem; margin-top: .4rem; }
.hk-presc { font-size: .8rem; color: var(--tenue); font-variant-numeric: tabular-nums;
  white-space: nowrap; }
.hk-presc b { color: var(--texto); font-weight: 700; }
.hk-kg { flex: 1; min-width: 0; background: var(--sup); color: var(--texto);
  border: 1px solid var(--linea); border-radius: 5px; padding: .32rem .5rem;
  font-size: .8rem; font-weight: 600; font-family: inherit; font-variant-numeric: tabular-nums; }
.hk-btn-nota { flex: none; background: transparent; color: var(--bola);
  border: 1px solid var(--bola); border-radius: 999px; padding: .3rem .62rem;
  font-size: .7rem; font-weight: 700; line-height: 1; }
.hk-ej-ok .hk-btn-nota { color: var(--tenue); border-color: var(--linea); }

/* Ficha emergente */
.hk-velo { position: fixed; inset: 0; z-index: 50; background: rgba(4,14,19,.72);
  display: flex; align-items: flex-end; justify-content: center;
  font-family: var(--tipo); color: var(--texto); -webkit-font-smoothing: antialiased; }
.hk-velo *, .hk-velo *::before, .hk-velo *::after { box-sizing: border-box; }
.hk-velo button { font-family: inherit; cursor: pointer; }
.hk-velo button:focus-visible, .hk-velo a:focus-visible {
  outline: 2px solid var(--bola); outline-offset: 2px; }
.hk-ficha { width: 100%; max-width: 30rem; background: var(--sup);
  border-top: 3px solid var(--bola); border-radius: 14px 14px 0 0;
  padding: .7rem 1.15rem 1.5rem; max-height: 82vh; overflow-y: auto;
  animation: hk-subir .22s ease-out; }
@keyframes hk-subir { from { transform: translateY(14px); opacity: .6; } to { transform: none; opacity: 1; } }
.hk-ficha-asa { width: 34px; height: 4px; border-radius: 2px; background: var(--linea);
  margin: 0 auto .9rem; }
.hk-ficha-tit { margin: 0 0 .5rem; font-size: 1.02rem; font-weight: 700; line-height: 1.3; }
.hk-ficha-presc { margin: 0 0 .9rem; font-size: .82rem; color: var(--tenue);
  font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: .6rem; }
.hk-ficha-presc b { color: var(--texto); font-weight: 700; }
.hk-ficha-kg { color: var(--texto); font-weight: 600; }
.hk-ficha-nota { margin: 0 0 1rem; font-size: .87rem; line-height: 1.6;
  padding-left: .75rem; border-left: 2px solid var(--bola); }
.hk-ficha-vacia { margin: 0 0 1rem; font-size: .84rem; color: var(--tenue); }
.hk-video { display: inline-block; font-size: .8rem; font-weight: 600; color: var(--bola);
  text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px; }
.hk-ficha-cerrar { display: block; width: 100%; margin-top: 1.3rem; padding: .72rem;
  background: transparent; border: 1px solid var(--linea); border-radius: 8px;
  color: var(--texto); font-size: .85rem; font-weight: 600; }

.hk-pie { margin: 2.2rem 1rem 0; padding-top: 1rem; border-top: 1px solid var(--linea);
  font-size: .7rem; color: var(--tenue); text-align: center; }
@media (prefers-reduced-motion: reduce) {
  .hk *, .hk-ficha { transition: none !important; animation: none !important; }
}
html, body { margin: 0; padding: 0; background: #0A1E28; }
</style>
</head>

const KEY = "hockey:registro";
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const CORTO = ["L","M","X","J","V","S","D"];
const TIPO = {
  gym:  { label: "Fuerza",        c: "#4A8FD4" },
  bw:   { label: "Peso corporal", c: "#4AB8A0" },
  run:  { label: "Carrera",       c: "#57B87A" },
  acc:  { label: "Velocidad",     c: "#E8A33D" },
  rsa:  { label: "RSA",           c: "#A97BE0" },
  done: { label: "Hecho",         c: "#7C8B93" },
  rest: { label: "Descanso",      c: "#3A4C56" },
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  ));
}

function ejercicio(i) {
  const c = DATA.C[i];
  return {
    nombre: DATA.X[c[0]], kg: c[1], series: c[2], reps: c[3],
    nota: DATA.N[c[4]], video: DATA.L[c[5]], sustituido: c[6] === 1,
  };
}

function parseFecha(f) {
  const m = /^(\d{2})\/(\d{2})$/.exec(f || "");
  if (!m) return null;
  return { d: +m[1], m: +m[2] };
}

// --------------------------------------------------------------
// Estado y almacenamiento — localStorage normal del navegador.
// Al ser síncrono, no hace falta esperar ni "vaciar" nada antes
// de cerrar la página: cada cambio se escribe en el momento.
// --------------------------------------------------------------
let almacenDisponible = true;
try {
  const t = "__test__";
  localStorage.setItem(t, "1");
  localStorage.removeItem(t);
} catch (e) {
  almacenDisponible = false;
}

const estado = { semana: 0, registro: null };

function estadoInicial() {
  const semilla = { hecho: {}, kg: {} };
  DATA.W.forEach((w, wi) =>
    w[4].forEach((s, si) =>
      (s[5] || []).forEach((ok, ei) => {
        if (ok) semilla.hecho[`${wi}.${si}.${ei}`] = 1;
      })
    )
  );
  let guardado = null;
  if (almacenDisponible) {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) guardado = JSON.parse(raw);
    } catch (e) { /* nada guardado aún, o dato dañado */ }
  }
  estado.registro = guardado
    ? { hecho: { ...semilla.hecho, ...guardado.hecho }, kg: { ...guardado.kg } }
    : semilla;

  const hoy = new Date();
  const dd = hoy.getDate(), mm = hoy.getMonth() + 1;
  let mejor = 0, dif = 1e9;
  DATA.W.forEach((w, wi) => {
    const f = parseFecha((w[1] || "").split("–")[0].trim());
    if (!f) return;
    const delta = Math.abs((f.m - mm) * 31 + (f.d - dd));
    if (delta < dif) { dif = delta; mejor = wi; }
  });
  estado.semana = mejor;
}

function marcarIndicador(ok) {
  const el = document.getElementById("indicador-guardado");
  if (!el) return;
  el.textContent = ok ? "" : "no se pudo guardar en este navegador";
  el.className = ok ? "hk-guardando" : "hk-error";
}

function persistir() {
  if (!almacenDisponible) { marcarIndicador(false); return; }
  try {
    localStorage.setItem(KEY, JSON.stringify(estado.registro));
    marcarIndicador(true);
  } catch (e) {
    console.error("No se pudo guardar", e);
    marcarIndicador(false);
  }
}

function marcar(id) {
  const h = { ...estado.registro.hecho };
  if (h[id]) delete h[id]; else h[id] = 1;
  estado.registro = { ...estado.registro, hecho: h };
  persistir();
  render();
}

function anotarKg(id, valor) {
  estado.registro.kg[id] = valor;
  persistir();
  // Sin re-render aquí: perdería el foco y la posición del cursor
  // mientras escribes. Solo se actualiza el indicador de guardado.
}

// --------------------------------------------------------------
// Ficha (modal de aclaración)
// --------------------------------------------------------------
function abrirFicha(ci, id) {
  const e = ejercicio(ci);
  const valor = estado.registro.kg[id] ?? e.kg;
  const capa = document.getElementById("capa-ficha");
  capa.innerHTML = `
    <div class="hk-velo" data-accion="cerrar-ficha">
      <div class="hk-ficha" data-accion="ficha-cuerpo" role="dialog" aria-modal="true" aria-label="Aclaración de ${esc(e.nombre)}">
        <div class="hk-ficha-asa"></div>
        <h3 class="hk-ficha-tit">${e.sustituido ? '<span class="hk-sust">◆</span>' : ''}${esc(e.nombre)}</h3>
        <p class="hk-ficha-presc"><b>${esc(e.series)}</b> × ${esc(e.reps)}
          <span class="hk-ficha-kg">${esc(valor)}</span></p>
        ${e.nota
          ? `<p class="hk-ficha-nota">${esc(e.nota)}</p>`
          : `<p class="hk-ficha-vacia">Este ejercicio no lleva aclaración.</p>`}
        ${e.video
          ? `<a class="hk-video" href="${esc(e.video)}" target="_blank" rel="noopener noreferrer">Ver vídeo del ejercicio</a>`
          : ''}
        <button class="hk-ficha-cerrar" data-accion="cerrar-ficha">Cerrar</button>
      </div>
    </div>`;
  capa.querySelector(".hk-ficha-cerrar").focus();
}
function cerrarFicha() {
  document.getElementById("capa-ficha").innerHTML = "";
}

// --------------------------------------------------------------
// Render de la semana actual
// --------------------------------------------------------------
function render() {
  const raiz = document.getElementById("raiz");
  if (!estado.registro) {
    raiz.innerHTML = `<div class="hk-carga">Abriendo el plan…</div>`;
    return;
  }

  const w = DATA.W[estado.semana];
  const [mes, rango, etiqueta, notaSemana, sesiones] = w;

  let totalW = 0, hechosW = 0;
  sesiones.forEach((s, si) => {
    (s[4] || []).forEach((_, ei) => {
      totalW++;
      if (estado.registro.hecho[`${estado.semana}.${si}.${ei}`]) hechosW++;
    });
  });
  const pctW = totalW ? Math.round((hechosW / totalW) * 100) : 0;

  const porDia = DIAS.map((d) => {
    const si = sesiones.findIndex((s) => s[0] === d);
    if (si < 0) return { estadoDia: "vacio" };
    const s = sesiones[si];
    if (s[3] === "rest") return { estadoDia: "descanso", si };
    const n = (s[4] || []).length;
    const h = (s[4] || []).filter((_, ei) => estado.registro.hecho[`${estado.semana}.${si}.${ei}`]).length;
    return { estadoDia: n && h === n ? "completo" : h ? "parcial" : "pendiente", si, c: TIPO[s[3]].c };
  });

  let html = `
  <header class="hk-top">
    <div class="hk-nav">
      <button class="hk-flecha" data-accion="prev" ${estado.semana === 0 ? "disabled" : ""} aria-label="Semana anterior">‹</button>
      <div class="hk-cab">
        <div class="hk-mes">${esc(mes)}</div>
        <div class="hk-rango">${esc(rango)}</div>
      </div>
      <button class="hk-flecha" data-accion="next" ${estado.semana === DATA.W.length - 1 ? "disabled" : ""} aria-label="Semana siguiente">›</button>
    </div>
    <div class="hk-etiqueta">${esc(etiqueta)}</div>
    <div class="hk-tira">
      ${porDia.map((p, i) => `
        <button class="hk-dia hk-dia-${p.estadoDia}" ${p.c ? `style="--dc:${p.c}"` : ""}
                ${p.si != null ? `data-accion="jump" data-si="${p.si}"` : ""}>
          <span class="hk-dia-letra">${CORTO[i]}</span><span class="hk-punto"></span>
        </button>`).join("")}
    </div>
    <div class="hk-barra" role="progressbar" aria-valuenow="${pctW}" aria-valuemin="0" aria-valuemax="100">
      <div class="hk-barra-int" style="width:${pctW}%"></div>
    </div>
    <div class="hk-resumen">
      <span class="hk-cifra">${hechosW}</span>
      <span class="hk-de">de ${totalW} ejercicios</span>
      <span id="indicador-guardado" class="hk-guardando"></span>
    </div>
  </header>`;

  if (notaSemana) html += `<p class="hk-nota-semana">${esc(notaSemana)}</p>`;

  html += `<main>`;
  sesiones.forEach((s, si) => {
    const [dia, fecha, titulo, tipo, ejs] = s;
    if (tipo === "rest" || !ejs || ejs.length === 0) {
      html += `
      <section id="s${si}" class="hk-ses hk-ses-rest">
        <div class="hk-ses-cab"><span class="hk-ses-dia">${dia} ${fecha}</span></div>
        <p class="hk-rest-txt">${esc(titulo)}</p>
      </section>`;
      return;
    }
    const n = ejs.length;
    const h = ejs.filter((_, ei) => estado.registro.hecho[`${estado.semana}.${si}.${ei}`]).length;
    const completa = h === n;
    const tc = TIPO[tipo].c;

    html += `
      <section id="s${si}" class="hk-ses ${completa ? "hk-ses-ok" : ""}" style="--tc:${tc}">
        <div class="hk-ses-cab">
          <div><span class="hk-ses-dia">${dia} ${fecha}</span><h2 class="hk-ses-tit">${esc(titulo)}</h2></div>
          <div class="hk-ses-cont">${h}/${n}</div>
        </div>
        <ol class="hk-lista">`;

    ejs.forEach((ci, ei) => {
      const e = ejercicio(ci);
      const id = `${estado.semana}.${si}.${ei}`;
      const ok = !!estado.registro.hecho[id];
      const valor = estado.registro.kg[id] ?? e.kg;
      const tieneFicha = !!(e.nota || e.video);
      html += `
        <li class="hk-ej ${ok ? "hk-ej-ok" : ""}">
          <div class="hk-ej-fila">
            <button class="hk-check" data-accion="marcar" data-id="${id}" aria-pressed="${ok}" aria-label="Marcar ${esc(e.nombre)}">
              <span class="hk-check-marca"></span>
            </button>
            <div class="hk-ej-cuerpo">
              <p class="hk-ej-nombre">${e.sustituido ? '<span class="hk-sust" title="Ejercicio sustituido">◆</span>' : ''}${esc(e.nombre)}</p>
              <div class="hk-ej-datos">
                <span class="hk-presc"><b>${esc(e.series)}</b> × ${esc(e.reps)}</span>
                <input class="hk-kg" data-kg-id="${id}" value="${esc(valor)}" aria-label="Carga de ${esc(e.nombre)}" spellcheck="false" autocomplete="off">
                ${tieneFicha ? `<button class="hk-btn-nota" data-accion="nota" data-ci="${ci}" data-id="${id}" aria-label="Ver aclaración de ${esc(e.nombre)}">nota</button>` : ""}
              </div>
            </div>
          </div>
        </li>`;
    });
    html += `</ol></section>`;
  });
  html += `</main>
  <footer class="hk-pie">Plan de hockey · ${DATA.W.length} semanas · mayo 2026 a febrero 2027</footer>`;

  raiz.innerHTML = html;
}

// --------------------------------------------------------------
// Delegación de eventos: un solo listener, no hace falta
// reengancharlo cada vez que se regenera el HTML.
// --------------------------------------------------------------
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-accion]");
  if (!el) return;
  const accion = el.dataset.accion;
  if (accion === "prev") { estado.semana = Math.max(0, estado.semana - 1); render(); }
  else if (accion === "next") { estado.semana = Math.min(DATA.W.length - 1, estado.semana + 1); render(); }
  else if (accion === "jump") {
    document.getElementById(`s${el.dataset.si}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  else if (accion === "marcar") { marcar(el.dataset.id); }
  else if (accion === "nota") { abrirFicha(+el.dataset.ci, el.dataset.id); }
  else if (accion === "cerrar-ficha") { cerrarFicha(); }
});

document.addEventListener("input", (ev) => {
  if (ev.target.matches("[data-kg-id]")) {
    anotarKg(ev.target.dataset.kgId, ev.target.value);
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") cerrarFicha();
});

// --------------------------------------------------------------
// Arranque
// --------------------------------------------------------------
estadoInicial();
render();
</script>
</body>
</html>
